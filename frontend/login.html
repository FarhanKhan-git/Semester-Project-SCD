<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | VivaVoice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth">

    <!-- Left: brand panel -->
    <div class="auth-side">
      <a class="logo" href="index.html">
        <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>VivaVoice
      </a>
      <div>
        <div class="big-wave">
          <span style="height:30%"></span><span style="height:60%"></span><span style="height:90%"></span>
          <span style="height:50%"></span><span style="height:100%"></span><span style="height:70%"></span>
          <span style="height:40%"></span><span style="height:80%"></span><span style="height:55%"></span>
          <span style="height:30%"></span>
        </div>
        <h2>Welcome back.</h2>
        <p>Log in to create exams, take your viva, or review results.</p>
      </div>
      <p class="small">Foundation University Islamabad</p>
    </div>

    <!-- Right: login form -->
    <div class="auth-form">
      <div class="card">
        <h1>Log in</h1>
        <p class="card-sub">Enter your email and password.</p>
        <div id="message" class="hidden"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Your password">
          </div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>

        <p class="mt-16 small">New to VivaVoice? <a href="register.html">Create an account</a></p>
        <div class="demo-box"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          },
        });
        saveLogin(data);
        window.location.href = homePage(data.user.role);
      } catch (error) {
        showMessage("message", error.message);
      }
    });
  </script>
</body>
</html>
